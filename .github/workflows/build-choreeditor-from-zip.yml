name: Build ChoreEditor Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChoreEditor-Android-Repository.zip'
      - '.github/workflows/build-choreeditor-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "ChoreEditor-Android-Repository.zip" ]; then
            echo "ERROR: ZIP file not found!"
            ls -la
            exit 1
          fi

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q "ChoreEditor-Android-Repository.zip" -d extracted
          if [ ! -f "extracted/ChoreEditor/android-app/settings.gradle.kts" ]; then
            echo "ERROR: Android project not found after extraction!"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and run tests
        run: |
          gradle -p extracted/ChoreEditor/android-app \
            --no-daemon \
            :app:assembleDebug \
            :app:testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChoreEditor-debug-APK
          path: extracted/ChoreEditor/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
